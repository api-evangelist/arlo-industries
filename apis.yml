name: Arlo Industries
description: >-
  Arlo Industries is a San Francisco defense hardware company (Y Combinator,
  Spring 2026) building a passive sensing network for detecting and tracking
  drones and aerial threats without traditional radar. Its product, Mentat, uses
  a distributed mesh architecture of low-cost sensors that cooperatively detect
  and track targets in 3D while remaining invisible to the threats they monitor.
  The company frames its approach around "asymmetric economics" — sensor
  deployment cost grows linearly while tracking accuracy grows exponentially —
  making the system more scalable than conventional radar installations. Arlo
  has demonstrated its technology with Ukrainian military operators on active
  frontlines and maintains partnerships across the US, Ukraine, and Northern
  Europe. As an early-stage hardware startup it publishes no public API,
  developer program, or SDKs at this time.
